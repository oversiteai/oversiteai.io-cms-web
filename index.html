<!doctype html>
<html lang="en" data-theme="subtle">
  <head>
    <script>
      /* Site uses a single fixed theme ("subtle" — the current dark design).
         Clear any legacy theme key so nothing drifts between sessions. */
      (function () {
        try { localStorage.removeItem('oversiteai-theme'); } catch (e) {}
        document.documentElement.setAttribute('data-theme', 'subtle');
      })();
    </script>
    <script>
      /* HashRouter: if there is no route in the hash yet, normalize to "#/". */
      (function () {
        try {
          var h = window.location.hash;
          if (h && h.length > 1 && h !== '#') return;
          window.history.replaceState(null, '', window.location.pathname + window.location.search + '#/');
        } catch (e) {}
      })();
    </script>
